name: CI

on:
  push:
    branches: [main, homologacao, 'feat/**', 'fix/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes do backend (H2)
        run: mvn -B -q test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Testes do app
        # Fuso fixo do Brasil: as regras de data do app usam o dia local.
        env:
          TZ: America/Sao_Paulo
        run: flutter test
