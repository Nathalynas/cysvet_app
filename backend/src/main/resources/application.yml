spring:
  application:
    name: cysvet-backend
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 250MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins:
          - http://localhost:3000
          - http://127.0.0.1:3000
          - http://localhost:8080
          - http://127.0.0.1:8080
        allowed-methods:
          - GET
          - OPTIONS
        allowed-headers:
          - Authorization
          - Content-Type
          - Accept
          - empresaid
        allow-credentials: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          include: ping,db,diskSpace

app:
  docs:
    enabled: true
  errors:
    include-details: true
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:8080
      - http://127.0.0.1:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - empresaid
    allow-credentials: true
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    enabled: ${APP_DOCS_ENABLED:${app.docs.enabled}}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_DOCS_ENABLED:${app.docs.enabled}}
    path: /swagger-ui.html
